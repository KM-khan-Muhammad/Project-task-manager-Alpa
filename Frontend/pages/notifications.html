<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications | TaskFlow</title>
  <meta name="description" content="View your notification history in TaskFlow." />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/project.css" />
  <style>
    .notif-page-item {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
    }
    .notif-page-item:hover {
      border-color: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .notif-page-item.unread {
      border-left: 4px solid var(--primary);
      background: rgba(99,102,241,0.1);
    }
    .notif-page-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--bg-tertiary);
      color: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      border: 1px solid var(--border-light);
    }
    .notif-page-content { flex: 1; }
    .notif-page-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; color: var(--text-primary); }
    .notif-page-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }
    .notif-page-time { font-size: 12px; color: var(--text-muted); margin-top: 8px; display: flex; align-items: center; gap: 5px; }
    
    .notif-delete-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      opacity: 0;
      transition: var(--transition);
    }
    .notif-page-item:hover .notif-delete-btn { opacity: 1; }
    
    .unread-indicator {
      position: absolute;
      bottom: 15px;
      right: 15px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    @media (max-width: 768px) {
      .notif-page-item {
        padding: 16px 44px 16px 16px;
      }
      .notif-delete-btn {
        opacity: 1 !important;
        right: 12px;
        top: 12px;
      }
      .unread-indicator {
        right: 12px;
        bottom: 12px;
      }
      .topnav-right .btn {
        font-size: 12px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon"><i class="fas fa-rocket"></i></div>
        <span class="sidebar-logo-text">TaskFlow</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section-title">Main</div>
      <a href="dashboard.html" class="sidebar-link">
        <span class="sidebar-link-icon"><i class="fas fa-house"></i></span>
        <span class="sidebar-link-text">Dashboard</span>
      </a>
      <a href="tasks.html" class="sidebar-link">
        <span class="sidebar-link-icon"><i class="fas fa-check-double"></i></span>
        <span class="sidebar-link-text">My Tasks</span>
      </a>


      <div class="sidebar-section-title" style="margin-top:16px">Projects</div>
      <div class="sidebar-projects" id="sidebarProjects"></div>
    </nav>

    <div class="sidebar-bottom">
      <button class="sidebar-link btn-ghost" id="btnCreateProject" style="color:var(--primary-light)">
        <span class="sidebar-link-icon"><i class="fas fa-plus"></i></span>
        <span class="sidebar-link-text">New Project</span>
      </button>
      <div class="dropdown-divider" style="margin: 8px 0; opacity: 0.1;"></div>
      <div class="sidebar-user" id="sidebarUser" title="Profile Settings" onclick="openProfileModal()">
        <div class="avatar avatar-sm sidebar-avatar" style="background:#6366f1">?</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Loading...</div>
          <div class="sidebar-user-role">Member</div>
        </div>
      </div>
      <button class="sidebar-link btn-ghost" id="btnLogout">
        <span class="sidebar-link-icon"><i class="fas fa-door-open"></i></span>
        <span class="sidebar-link-text">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">
    <header class="topnav">
      <div class="topnav-left">
        <button class="topnav-btn" id="sidebarToggle" title="Toggle Sidebar" style="margin-right: 16px;"><i class="fas fa-bars"></i></button>
        <h1 class="topnav-title">Notification History</h1>
      </div>
      <div class="topnav-right">
        <button class="btn btn-ghost btn-sm" id="markAllReadPage">Mark all read</button>
        <button class="btn btn-ghost btn-sm danger" id="clearAllNotifsPage" style="margin-left:8px"><i class="fas fa-trash"></i> Clear all</button>
        <div class="dropdown" id="themeDropdown">
          <button class="topnav-btn" id="themeToggle"><i class="theme-icon fas fa-circle-half-stroke"></i></button>
          <div class="dropdown-menu" style="top:50px; right:0">
            <button class="dropdown-item" onclick="applyTheme('light')">Light</button>
            <button class="dropdown-item" onclick="applyTheme('dark')">Dark</button>
            <button class="dropdown-item" onclick="applyTheme('system')">System</button>
          </div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1>Notifications</h1>
          <p>Stay updated with your team's activity.</p>
        </div>
      </div>

      <div id="notificationsPageList">
        <div style="text-align:center;padding:60px">
          <i class="fas fa-circle-notch fa-spin"></i> Loading...
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/wsClient.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/notifications-page.js"></script>
</body>
</html>
